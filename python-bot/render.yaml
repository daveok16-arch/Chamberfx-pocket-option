# Render.com Blueprint
# Deploys the CHAMBERFX Trading Bot as a background worker

services:
  - type: web
    name: chamberfx-trading-bot
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MIN_CONFIDENCE
        value: "70"
      - key: TICK_THRESHOLD
        value: "175"
