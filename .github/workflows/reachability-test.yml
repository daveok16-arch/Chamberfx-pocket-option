name: po-reachability-test

# One-shot diagnostic: can a GitHub-hosted runner reach Pocket Option's
# demo endpoints from its datacenter IP? Pocket Option's WAF blocks some
# cloud IP ranges -- this determines whether GH Actions can host the signal bot..
on:
  pull_request:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Pocket Option endpoints
        run: |
          set +e
          for u in "https://po.trade/en/cabinet/try-demo/" "https://pocketoption.com/en/cabinet/try-demo/" "https://po.cash/en/cabinet/try-demo/"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "$u" )
            echo "$u -> HTTP $code"
          done
          echo "--- also probe the trading-domain root ---"
          for d in po.trade pocketoption.com po.cash; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 "https://$d/" )
            echo "https://$d/ -> HTTP $code"
          done
          # Expect: 200/302/301 (reachable).  401/403/4xx from every URL means WAF block.