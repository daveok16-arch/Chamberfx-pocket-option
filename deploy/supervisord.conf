; Supervisord — runs the container's processes together
; =====================================================
; The capture engine and the Python inference service are separate programs
; that talk over HTTP. Running them in ONE container keeps INFERENCE_URL a
; constant (http://127.0.0.1:8000) and means a single Render service to deploy.
;
; Processes:
;   inference — FastAPI model server (serves /predict, /health, /reload)
;   capture   — the TypeScript engine (ticks, features, labels, predictions)
;   retrain   — periodic train.py; a harmless no-op until the row floor is met
;
; All programs run as the unprivileged `botuser`; supervisord itself runs as
; root only so the entrypoint can fix ownership of the mounted data disk.
;
; Every %(ENV_...)s reference below has a default set in the Dockerfile, because
; supervisord errors out on a reference to an unset variable.

[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:inference]
command=/app/venv/bin/uvicorn app:app --host 127.0.0.1 --port 8000
directory=/app/inference
user=botuser
environment=MODEL_FILE="%(ENV_MODEL_FILE)s",MODEL_AUTO_RELOAD="1",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The collector is the only process that must flush state on shutdown, so it
; gets a real SIGTERM and time to finish. `tsx` runs the entrypoint directly
; (not via npm) so the signal is not swallowed by a wrapper shell.
;
; TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are deliberately NOT listed here:
; supervisord passes its own environment through to children, so Render's
; runtime values reach the process without the secret names being baked into
; the image or this file.
[program:capture]
command=/app/node_modules/.bin/tsx capture.ts
directory=/app
user=botuser
environment=NODE_ENV="production",PORT="%(ENV_PORT)s",PERIOD="%(ENV_PERIOD)s",HORIZON="%(ENV_HORIZON)s",INFERENCE_URL="http://127.0.0.1:8000",SIGNALS_FILE="%(ENV_SIGNALS_FILE)s",FEATURES_FILE="%(ENV_FEATURES_FILE)s"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Retraining is opportunistic: train.py refuses below its row floor and exits
; non-zero. The loop swallows that, so an early "not enough data" is normal.
[program:retrain]
command=/app/deploy/retrain-loop.sh
directory=/app
user=botuser
environment=SIGNALS_FILE="%(ENV_SIGNALS_FILE)s",MODEL_FILE="%(ENV_MODEL_FILE)s",RETRAIN_INTERVAL_SEC="%(ENV_RETRAIN_INTERVAL_SEC)s"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
