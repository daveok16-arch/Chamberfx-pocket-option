# Render.com Blueprint — Chamberfx Pocket Option OTC Live Price Capture
# =====================================================================
# Deploys the TypeScript capture engine as a Docker web service.
# It streams live Pocket Option OTC ticks + candles over the authenticated
# Socket.IO WebSocket and exposes a /health endpoint. This is the market-data
# foundation for the AI/ML prediction pipeline (no strategy/risk/execution).
#
# The Dockerfile lives at the REPO ROOT (not price-bot/) so Render — which
# clones the repo root — finds it directly. The app source is price-bot/.
#
# Apply: render blueprint deploy (Render dashboard) or `render blueprint apply`.
# Optional:
#   PERIOD  — candle period in seconds: 60 | 180 | 300 (default 60)

services:
  - type: web
    name: chamberfx-price-capture
    env: docker
    region: oregon
    plan: standard           # Playwright+Chromium OOMs the 512MB starter (SIGTERM kills mid-session);standard gives headroom
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PERIOD
        value: "60"
