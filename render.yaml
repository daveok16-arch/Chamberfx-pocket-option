# Render.com Blueprint — Chamberfx Pocket Option OTC Trade Bot
# ============================================================
# Deploys the TypeScript trade bot as a Docker web service.
# The bot captures live Pocket Option OTC prices via Playwright + WebSocket
# and exposes a /health endpoint. This is the capture foundation for building
# trading strategies (the old signal engine was removed).
#
# The Dockerfile lives at the REPO ROOT (not price-bot/) so Render — which
# clones the repo root — finds it directly. The app source is price-bot/.
#
# Apply: render blueprint deploy (Render dashboard) or `render blueprint apply`.
# Optional:
#   PERIOD  — candle period in seconds: 60 | 180 | 300 (default 60)

services:
  - type: web
    name: chamberfx-trade-bot
    env: docker
    region: oregon
    plan: starter            # Playwright/chromium needs ~1GB; bump to standard if OOM
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PERIOD
        value: "60"
      # Telegram signal delivery — set these on the Render dashboard (sync: false = not hardcoded in repo）。
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
