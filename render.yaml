# Render.com Blueprint — Chamberfx Pocket Option OTC capture + prediction
# =======================================================================
# Deploys ONE Docker web service that runs both halves of the pipeline:
#   - the TypeScript capture/prediction engine (ticks, features, labels)
#   - the FastAPI inference service (the trained model)
# plus a periodic retrain loop. supervisord runs all three; the engine serves
# /health on PORT.
#
# The Dockerfile lives at the REPO ROOT (not price-bot/) so Render — which
# clones the repo root — finds it directly.
#
# Apply: render blueprint deploy (Render dashboard) or `render blueprint apply`.
#
# Environment:
#   PERIOD                — candle period in seconds: 60 | 180 | 300 (default 60)
#   HORIZON               — label horizon in seconds: 60 | 180 | 300 (default 60)
#   RETRAIN_INTERVAL_SEC  — how often the retrain loop runs (default 1800)
#   TELEGRAM_BOT_TOKEN    — set in the dashboard (sync: false) to enable delivery
#   TELEGRAM_CHAT_ID      — set in the dashboard (sync: false) to enable delivery
#
# The persistent disk is what makes the dataset survive `autoDeploy` rebuilds:
# signals.json / live-prices.json / model.pkl all live under /app/data.

services:
  - type: web
    name: chamberfx-price-capture
    env: docker
    region: oregon
    plan: standard           # Playwright+Chromium OOMs the 512MB starter (SIGTERM kills mid-session);standard gives headroom
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: chamberfx-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PERIOD
        value: "60"
      # Label horizon in seconds: 60 | 180 | 300. Independent of PERIOD (which
      # sets the candle size); the feature window stays 60s either way.
      #
      # Kept at 60 to match the existing dataset. Switching to 180 invalidates
      # it: a signals.json that spans a horizon change holds two different
      # prediction problems, and train.py now refuses such a file rather than
      # silently training one model on both. To switch, archive the current
      # signals.json on the disk and let a fresh one accumulate.
      - key: HORIZON
        value: "60"
      # The dataset and the trained model live on the mounted disk, so a
      # redeploy does not wipe the observations collected since the last push.
      - key: DATA_DIR
        value: /app/data
      - key: SIGNALS_FILE
        value: /app/data/signals.json
      - key: FEATURES_FILE
        value: /app/data/live-prices.json
      - key: MODEL_FILE
        value: /app/data/model.pkl
      - key: RETRAIN_INTERVAL_SEC
        value: "1800"
      # Deliver every 60s window rather than one signal per asset every 5 min.
      # Safe because batching already collapses a bucket to a single message,
      # so the ceiling is 60/hour, not the 360/hour the 5-min default assumed.
      - key: SIGNAL_COOLDOWN_MS
        value: "0"
      # Secrets: `sync: false` means Render prompts for these in the dashboard
      # rather than storing them in source. Delivery stays off until both are set.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
