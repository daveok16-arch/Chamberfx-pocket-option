# Render.com Blueprint
# Deploys the CHAMBERFX Trading Bot as a Web Service
# Root directory: python-bot

services:
  - type: web
    name: chamberfx-trading-bot
    env: python
    region: oregon
    plan: free
    rootDirectory: python-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: MIN_CONFIDENCE
        value: "70"
      - key: TICK_THRESHOLD
        value: "175"
      - key: PORT
        value: "10000"
